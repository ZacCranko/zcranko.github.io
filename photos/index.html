<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <title>Photos — Zachary Cranko</title>
  <meta name="description" content="Photographs by Zachary Cranko.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfbfb;
      --surface: #f1f1f2;
      --surface-hover: rgba(0, 0, 0, 0.032);
      --ink: #1d1d1f;
      --ink-secondary: #5e5e63;
      --ink-tertiary: #86868b;
      --lightbox-bg: rgba(251, 251, 251, 0.96);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --surface: #161618;
        --surface-hover: rgba(255, 255, 255, 0.045);
        --ink: #f5f5f7;
        --ink-secondary: #a1a1a6;
        --ink-tertiary: #6e6e73;
        --lightbox-bg: rgba(11, 11, 12, 0.96);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      text-rendering: optimizeLegibility;
      overflow-x: clip;
      overscroll-behavior-x: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: -0.01em;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y pinch-zoom;
      padding:
        max(72px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(120px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 72px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      font-weight: 500;
      letter-spacing: -0.032em;
      line-height: 1.12;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 15.5px;
      letter-spacing: -0.012em;
      line-height: 1.6;
      color: var(--ink-secondary);
      max-width: 560px;
    }

    .home-link {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: -0.006em;
      color: var(--ink-tertiary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .home-link .arrow {
      display: inline-block;
      transition: transform 0.15s ease;
    }

    .home-link:hover {
      color: var(--ink);
    }

    .home-link:hover .arrow {
      transform: translateX(2px);
    }

    .albums {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 20px;
      font-size: 14px;
    }

    .albums:empty {
      display: none;
    }

    .album-btn {
      background: none;
      border: none;
      font: inherit;
      color: var(--ink-tertiary);
      cursor: pointer;
      padding: 0;
    }

    .album-btn:hover,
    .album-btn.active {
      color: var(--ink);
    }

    .album-btn.active {
      font-weight: 500;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: clamp(32px, 5vw, 72px);
      row-gap: clamp(48px, 7vw, 96px);
      align-items: center;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .tile {
      background: var(--surface);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: block;
      border: none;
      padding: 0;
      max-width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 320ms ease, transform 1050ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile img.loaded {
      opacity: 1;
    }

    @media (hover: hover) and (pointer: fine) {
      .tile:hover img.loaded {
        transform: scale(1.004);
      }
    }

    .empty {
      color: var(--ink-tertiary);
      font-size: 14.5px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--lightbox-bg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overscroll-behavior: contain;
      touch-action: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 220ms;
      padding:
        max(52px, calc(env(safe-area-inset-top) + 32px))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0s;
    }

    .lightbox.dragging {
      transition: none;
    }

    .lb-chrome {
      transition: opacity 320ms ease, color 160ms ease;
    }

    .lightbox.idle .lb-chrome {
      opacity: 0;
    }

    .lightbox.idle .lb-chrome:hover,
    .lightbox.idle .lb-chrome:focus-visible {
      opacity: 1;
    }

    .lb-counter {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      font-size: 13px;
      letter-spacing: -0.006em;
      color: var(--ink-tertiary);
      font-variant-numeric: tabular-nums;
      user-select: none;
      pointer-events: none;
    }

    .lb-close {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      background: none;
      border: none;
      color: var(--ink-secondary);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 6px 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .lb-close:hover {
      color: var(--ink);
    }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-tertiary);
      font-size: 28px;
      cursor: pointer;
      padding: 18px 14px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lb-nav:hover {
      color: var(--ink);
    }

    .lb-nav[hidden] {
      display: none;
    }

    .lb-prev { left: max(8px, env(safe-area-inset-left)); }
    .lb-next { right: max(8px, env(safe-area-inset-right)); }

    .lb-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.985);
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .lightbox.open .lb-stage {
      transform: scale(1);
    }

    .lightbox.dragging .lb-stage {
      transition: none;
    }

    .lb-stage img {
      max-width: min(92vw, 1800px);
      max-height: calc(100vh - 124px);
      max-height: calc(100dvh - 124px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .lb-meta {
      margin-top: 14px;
      text-align: center;
      max-width: 720px;
      min-height: 22px;
    }

    .lb-caption {
      font-size: 14px;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .lb-exif {
      font-size: 12.5px;
      color: var(--ink-tertiary);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 720px) {
      body {
        padding:
          max(48px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(88px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      header {
        margin-bottom: 44px;
      }

      .gallery {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 40px;
      }

      .lb-nav {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Photos</h1>
      <p class="intro">Here are some pictures I've taken. Since I spend so much of my time with computers, looking through a camera is a nice way to spend some time in the world of my fellow humans. Also, optics, cameras, and photographic emulsions are pretty cool too.</p>
      <a class="home-link" href="/">Me <span class="arrow" aria-hidden="true">&rarr;</span></a>
      <div class="albums" id="albums" role="tablist" aria-label="Albums"></div>
    </header>

    <div class="gallery" id="gallery"></div>
    <p class="empty" id="empty" hidden></p>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-counter lb-chrome" id="lb-counter" aria-live="polite"></div>
    <button class="lb-close lb-chrome" id="lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev lb-chrome" id="lb-prev" type="button" aria-label="Previous">&lsaquo;</button>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
    </div>
    <button class="lb-nav lb-next lb-chrome" id="lb-next" type="button" aria-label="Next">&rsaquo;</button>
    <div class="lb-meta">
      <div class="lb-caption" id="lb-caption"></div>
      <div class="lb-exif" id="lb-exif"></div>
    </div>
  </div>

  <script>
    const GALLERY_URL = 'https://storage.googleapis.com/zcranko-images/gallery.json';

    const galleryEl = document.getElementById('gallery');
    const albumsEl = document.getElementById('albums');
    const emptyEl = document.getElementById('empty');
    const lightboxEl = document.getElementById('lightbox');
    const lbStage = document.getElementById('lb-stage');
    const lbImg = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    const lbPrev = document.getElementById('lb-prev');
    const lbNext = document.getElementById('lb-next');
    const lbCaption = document.getElementById('lb-caption');
    const lbExif = document.getElementById('lb-exif');

    let allPhotos = [];
    let visiblePhotos = [];
    let tileEls = [];
    let activeAlbum = null;
    let currentIndex = -1;
    let loadToken = 0;
    let pushedHistory = false;
    let idleTimer = null;
    let touchStartX = null;
    let touchStartY = null;
    let dragAxis = null;
    let dragDX = 0;
    let dragDY = 0;
    let lastLayoutWidth = 0;

    function photoAspect(photo) {
      return photo.width > 0 && photo.height > 0 ? photo.width / photo.height : 1.5;
    }

    // Equal-area print sizing: a 3:2 landscape and 2:3 portrait occupy the same visual area,
    // clamped cleanly within each grid column.
    function layoutGallery() {
      if (!tileEls.length) return;
      const containerWidth = Math.floor(galleryEl.clientWidth);
      if (containerWidth <= 0) return;
      lastLayoutWidth = containerWidth;

      const firstCell = tileEls[0].parentElement;
      const colW = Math.floor(firstCell ? firstCell.clientWidth : containerWidth);
      if (colW <= 0) return;

      const isSingleCol = window.innerWidth <= 720;
      const targetArea = (colW * colW) / (isSingleCol ? 1.35 : 1.5);
      const maxH = isSingleCol ? colW * 1.2 : colW;

      for (let i = 0; i < tileEls.length; i++) {
        const r = photoAspect(visiblePhotos[i]);
        let w = Math.sqrt(targetArea * r);
        let h = Math.sqrt(targetArea / r);
        const scale = Math.min(1, colW / w, maxH / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        const tile = tileEls[i];
        tile.style.width = `${w}px`;
        tile.style.height = `${h}px`;
      }
    }

    function formatExif(exif) {
      if (!exif) return '';
      return [
        exif.camera,
        exif.focalLength,
        exif.aperture,
        exif.shutter,
        exif.iso ? `ISO ${exif.iso}` : null,
        exif.takenAt,
      ].filter(Boolean).join(' · ');
    }

    function renderAlbums() {
      const names = [...new Set(allPhotos.map((p) => p.album).filter(Boolean))];
      albumsEl.innerHTML = '';
      if (names.length < 2) return;

      const items = [null, ...names];
      items.forEach((name) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'album-btn' + (activeAlbum === name ? ' active' : '');
        btn.textContent = name || 'All';
        btn.addEventListener('click', () => {
          activeAlbum = name;
          renderAlbums();
          renderGallery();
        });
        albumsEl.appendChild(btn);
      });
    }

    const revealObserver = typeof IntersectionObserver !== 'undefined'
      ? new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const img = entry.target;
          if (img.loading === 'lazy') img.loading = 'eager';
          if (img.complete && img.naturalWidth > 0) {
            img.classList.add('loaded');
            revealObserver.unobserve(img);
          }
        }
      }, { rootMargin: '800px 0px' })
      : null;

    function renderGallery() {
      visiblePhotos = activeAlbum
        ? allPhotos.filter((p) => p.album === activeAlbum)
        : allPhotos;

      if (revealObserver) revealObserver.disconnect();
      galleryEl.innerHTML = '';
      tileEls = [];
      if (!visiblePhotos.length) {
        emptyEl.textContent = 'No photographs published yet.';
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;

      const imgsToLoad = [];

      visiblePhotos.forEach((photo, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell';

        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.setAttribute('aria-label', photo.caption || 'View photograph');

        const img = document.createElement('img');
        img.alt = photo.caption || '';
        img.width = photo.width || 0;
        img.height = photo.height || 0;
        img.decoding = 'async';
        img.loading = idx < 12 ? 'eager' : 'lazy';
        const markLoaded = () => {
          img.classList.add('loaded');
          if (revealObserver) revealObserver.unobserve(img);
        };
        img.addEventListener('load', markLoaded, { once: true });

        tile.appendChild(img);
        tile.addEventListener('click', () => openLightbox(idx));
        cell.appendChild(tile);
        galleryEl.appendChild(cell);
        tileEls.push(tile);
        imgsToLoad.push({ img, url: photo.thumbUrl, markLoaded });
      });

      // Size tiles before assigning img.src so iOS Safari's lazy-loader never
      // observes 0x0 images or misses load events.
      layoutGallery();

      imgsToLoad.forEach(({ img, url, markLoaded }) => {
        img.src = url;
        if (img.complete && img.naturalWidth > 0) {
          markLoaded();
        } else if (revealObserver) {
          revealObserver.observe(img);
        }
      });
    }

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        if (Math.floor(galleryEl.clientWidth) !== lastLayoutWidth) {
          layoutGallery();
        }
      }).observe(galleryEl);
    } else {
      window.addEventListener('resize', layoutGallery);
    }

    function wakeChrome() {
      if (currentIndex < 0) return;
      lightboxEl.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (currentIndex >= 0) lightboxEl.classList.add('idle');
      }, 2200);
    }

    function openLightbox(idx, { fromHash = false } = {}) {
      const photo = visiblePhotos[idx];
      if (!photo) return;
      const wasOpen = currentIndex >= 0;
      currentIndex = idx;
      showCurrent();

      if (!fromHash) {
        const hash = `#${encodeURIComponent(photo.id)}`;
        if (!wasOpen) {
          history.pushState({ photoId: photo.id }, '', hash);
          pushedHistory = true;
        } else {
          history.replaceState({ photoId: photo.id }, '', hash);
        }
      }

      lightboxEl.classList.add('open');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      wakeChrome();
    }

    function closeLightbox({ fromPopState = false } = {}) {
      if (currentIndex < 0) return;
      currentIndex = -1;
      loadToken++;
      clearTimeout(idleTimer);
      lightboxEl.classList.remove('open', 'idle', 'dragging');
      lightboxEl.style.opacity = '';
      lbStage.style.transform = '';
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      if (!fromPopState) {
        if (pushedHistory) {
          pushedHistory = false;
          history.back();
        } else if (location.hash) {
          history.replaceState(null, '', location.pathname + location.search);
        }
      } else {
        pushedHistory = false;
      }
    }

    function showCurrent() {
      const photo = visiblePhotos[currentIndex];
      if (!photo) return;
      const token = ++loadToken;

      lbImg.alt = photo.caption || '';
      lbCaption.textContent = photo.caption || '';
      lbExif.textContent = formatExif(photo.exif);
      lbCounter.textContent = visiblePhotos.length > 1
        ? `${currentIndex + 1} / ${visiblePhotos.length}`
        : '';
      lbPrev.hidden = visiblePhotos.length < 2;
      lbNext.hidden = visiblePhotos.length < 2;

      // Show the cached thumbnail immediately, then swap seamlessly to full-res.
      const hi = new Image();
      hi.src = photo.fullUrl;
      if (hi.complete && hi.naturalWidth > 0) {
        lbImg.src = photo.fullUrl;
      } else {
        lbImg.src = photo.thumbUrl;
        const applyFull = () => {
          if (token === loadToken) lbImg.src = photo.fullUrl;
        };
        if (typeof hi.decode === 'function') {
          hi.decode().then(applyFull, () => {
            if (hi.complete && hi.naturalWidth > 0) applyFull();
          });
        } else {
          hi.addEventListener('load', applyFull, { once: true });
        }
      }

      // Preload adjacent full-resolution images.
      [-1, 1].forEach((delta) => {
        const next = visiblePhotos[(currentIndex + delta + visiblePhotos.length) % visiblePhotos.length];
        if (next && next !== photo) {
          const preload = new Image();
          preload.src = next.fullUrl;
        }
      });
    }

    function step(delta) {
      if (currentIndex < 0 || visiblePhotos.length < 2) return;
      currentIndex = (currentIndex + delta + visiblePhotos.length) % visiblePhotos.length;
      const photo = visiblePhotos[currentIndex];
      showCurrent();
      if (photo) {
        history.replaceState({ photoId: photo.id }, '', `#${encodeURIComponent(photo.id)}`);
      }
      wakeChrome();
    }

    function syncFromHash() {
      const raw = location.hash.slice(1);
      if (!raw) {
        if (currentIndex >= 0) closeLightbox({ fromPopState: true });
        return;
      }
      let targetId;
      try {
        targetId = decodeURIComponent(raw);
      } catch {
        targetId = raw;
      }
      let idx = visiblePhotos.findIndex((p) => p.id === targetId);
      if (idx < 0 && activeAlbum !== null) {
        activeAlbum = null;
        renderAlbums();
        renderGallery();
        idx = visiblePhotos.findIndex((p) => p.id === targetId);
      }
      if (idx >= 0) {
        openLightbox(idx, { fromHash: true });
      }
    }

    document.getElementById('lb-close').addEventListener('click', () => closeLightbox());
    lbPrev.addEventListener('click', () => step(-1));
    lbNext.addEventListener('click', () => step(1));
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl || e.target === lbStage) {
        closeLightbox();
      } else {
        wakeChrome();
      }
    });
    lightboxEl.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'touch') wakeChrome();
    });

    window.addEventListener('keydown', (e) => {
      if (currentIndex < 0) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    });

    window.addEventListener('popstate', syncFromHash);

    lightboxEl.addEventListener('touchstart', (e) => {
      wakeChrome();
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        dragAxis = null;
        dragDX = 0;
        dragDY = 0;
      } else {
        touchStartX = null;
        touchStartY = null;
        dragAxis = null;
      }
    }, { passive: true });

    lightboxEl.addEventListener('touchmove', (e) => {
      if (touchStartX === null || touchStartY === null || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (!dragAxis && Math.hypot(dx, dy) > 8) {
        if (dy > 0 && Math.abs(dy) > Math.abs(dx)) dragAxis = 'y';
        else if (Math.abs(dx) > Math.abs(dy)) dragAxis = 'x';
        else dragAxis = 'ignore';
      }

      if (dragAxis === 'y') {
        dragDY = Math.max(0, dy);
        const scale = Math.max(0.88, 1 - dragDY / 1400);
        const opacity = Math.max(0.15, 1 - dragDY / 360);
        lightboxEl.classList.add('dragging');
        lbStage.style.transform = `translate3d(0, ${dragDY}px, 0) scale(${scale})`;
        lightboxEl.style.opacity = String(opacity);
      } else if (dragAxis === 'x' && visiblePhotos.length > 1) {
        dragDX = dx;
        lightboxEl.classList.add('dragging');
        lbStage.style.transform = `translate3d(${Math.round(dx * 0.35)}px, 0, 0)`;
      }
    }, { passive: true });

    function finishTouch() {
      const axis = dragAxis;
      const dx = dragDX;
      const dy = dragDY;
      touchStartX = null;
      touchStartY = null;
      dragAxis = null;
      dragDX = 0;
      dragDY = 0;

      lightboxEl.classList.remove('dragging');
      lbStage.style.transform = '';
      lightboxEl.style.opacity = '';

      if (axis === 'y' && dy > 90) {
        closeLightbox();
      } else if (axis === 'x' && Math.abs(dx) > 48) {
        step(dx < 0 ? 1 : -1);
      }
    }

    lightboxEl.addEventListener('touchend', finishTouch, { passive: true });
    lightboxEl.addEventListener('touchcancel', finishTouch, { passive: true });

    (async () => {
      try {
        const res = await fetch(GALLERY_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allPhotos = Array.isArray(data.photos) ? data.photos : [];
        renderAlbums();
        renderGallery();
        syncFromHash();
      } catch (err) {
        emptyEl.textContent = 'Unable to load gallery right now.';
        emptyEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
