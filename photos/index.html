<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photos — Zachary Cranko</title>
  <meta name="description" content="Photographs by Zachary Cranko.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfbfb;
      --surface: #f1f1f2;
      --surface-hover: rgba(0, 0, 0, 0.032);
      --ink: #1d1d1f;
      --ink-secondary: #5e5e63;
      --ink-tertiary: #86868b;
      --lightbox-bg: rgba(11, 11, 12, 0.96);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --surface: #161618;
        --surface-hover: rgba(255, 255, 255, 0.045);
        --ink: #f5f5f7;
        --ink-secondary: #a1a1a6;
        --ink-tertiary: #6e6e73;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      text-rendering: optimizeLegibility;
      overflow-x: clip;
      overscroll-behavior-x: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: -0.01em;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y pinch-zoom;
      padding:
        max(72px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(120px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 72px;
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      font-weight: 500;
      letter-spacing: -0.032em;
      line-height: 1.12;
    }

    .home-link {
      font-size: 14px;
      letter-spacing: -0.006em;
      color: var(--ink-tertiary);
      text-decoration: none;
      white-space: nowrap;
    }

    .home-link:hover {
      color: var(--ink);
    }

    .intro {
      font-size: 15.5px;
      letter-spacing: -0.012em;
      line-height: 1.6;
      color: var(--ink-secondary);
      max-width: 560px;
    }

    .albums {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 20px;
      font-size: 14px;
    }

    .albums:empty {
      display: none;
    }

    .album-btn {
      background: none;
      border: none;
      font: inherit;
      color: var(--ink-tertiary);
      cursor: pointer;
      padding: 0;
    }

    .album-btn:hover,
    .album-btn.active {
      color: var(--ink);
    }

    .album-btn.active {
      font-weight: 500;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: clamp(32px, 5vw, 72px);
      row-gap: clamp(48px, 7vw, 96px);
      align-items: center;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .tile {
      background: var(--surface);
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
      display: block;
      border: none;
      padding: 0;
      max-width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 320ms ease, transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile img.loaded {
      opacity: 1;
    }

    @media (hover: hover) and (pointer: fine) {
      .tile:hover img.loaded {
        transform: scale(1.008);
      }
    }

    .empty {
      color: var(--ink-tertiary);
      font-size: 14.5px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--lightbox-bg);
      color: #f5f5f7;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overscroll-behavior: contain;
      touch-action: none;
      padding:
        max(28px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }

    .lightbox.open {
      display: flex;
    }

    .lb-close {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      background: none;
      border: none;
      color: rgba(245, 245, 247, 0.65);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 6px 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .lb-close:hover {
      color: #f5f5f7;
    }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(245, 245, 247, 0.45);
      font-size: 28px;
      cursor: pointer;
      padding: 18px 14px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lb-nav:hover {
      color: #f5f5f7;
    }

    .lb-prev { left: max(8px, env(safe-area-inset-left)); }
    .lb-next { right: max(8px, env(safe-area-inset-right)); }

    .lb-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-stage img {
      max-width: min(92vw, 1800px);
      max-height: calc(100vh - 110px);
      max-height: calc(100dvh - 110px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .lb-meta {
      margin-top: 14px;
      text-align: center;
      max-width: 720px;
      min-height: 22px;
    }

    .lb-caption {
      font-size: 14px;
      color: #f5f5f7;
      margin-bottom: 2px;
    }

    .lb-exif {
      font-size: 12.5px;
      color: rgba(245, 245, 247, 0.55);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 720px) {
      body {
        padding:
          max(48px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(88px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      header {
        margin-bottom: 44px;
      }

      .gallery {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 40px;
      }

      .lb-nav {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="header-row">
        <h1>Photos</h1>
        <a class="home-link" href="/">Zachary Cranko</a>
      </div>
      <p class="intro">Here are some pictures I've taken. With all the tech insanity, looking through a camera is a nice way to feel grounded. Also, optics, cameras, and photographic emulsions are pretty cool too.</p>
      <div class="albums" id="albums" role="tablist" aria-label="Albums"></div>
    </header>

    <div class="gallery" id="gallery"></div>
    <p class="empty" id="empty" hidden></p>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous">&lsaquo;</button>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
    </div>
    <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Next">&rsaquo;</button>
    <div class="lb-meta">
      <div class="lb-caption" id="lb-caption"></div>
      <div class="lb-exif" id="lb-exif"></div>
    </div>
  </div>

  <script>
    const GALLERY_URL = 'https://storage.googleapis.com/zcranko-images/gallery.json';

    const galleryEl = document.getElementById('gallery');
    const albumsEl = document.getElementById('albums');
    const emptyEl = document.getElementById('empty');
    const lightboxEl = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCaption = document.getElementById('lb-caption');
    const lbExif = document.getElementById('lb-exif');

    let allPhotos = [];
    let visiblePhotos = [];
    let tileEls = [];
    let activeAlbum = null;
    let currentIndex = -1;
    let touchStartX = null;
    let touchStartY = null;
    let lastLayoutWidth = 0;

    function photoAspect(photo) {
      return photo.width > 0 && photo.height > 0 ? photo.width / photo.height : 1.5;
    }

    // Equal-area print sizing: a 3:2 landscape and 2:3 portrait occupy the same visual area,
    // clamped cleanly within each grid column.
    function layoutGallery() {
      if (!tileEls.length) return;
      const containerWidth = Math.floor(galleryEl.clientWidth);
      if (containerWidth <= 0) return;
      lastLayoutWidth = containerWidth;

      const firstCell = tileEls[0].parentElement;
      const colW = Math.floor(firstCell ? firstCell.clientWidth : containerWidth);
      if (colW <= 0) return;

      const isSingleCol = window.innerWidth <= 720;
      const targetArea = (colW * colW) / (isSingleCol ? 1.35 : 1.5);
      const maxH = isSingleCol ? colW * 1.2 : colW;

      for (let i = 0; i < tileEls.length; i++) {
        const r = photoAspect(visiblePhotos[i]);
        let w = Math.sqrt(targetArea * r);
        let h = Math.sqrt(targetArea / r);
        const scale = Math.min(1, colW / w, maxH / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        const tile = tileEls[i];
        tile.style.width = `${w}px`;
        tile.style.height = `${h}px`;
      }
    }

    function formatExif(exif) {
      if (!exif) return '';
      return [
        exif.camera,
        exif.focalLength,
        exif.aperture,
        exif.shutter,
        exif.iso ? `ISO ${exif.iso}` : null,
        exif.takenAt,
      ].filter(Boolean).join(' · ');
    }

    function renderAlbums() {
      const names = [...new Set(allPhotos.map((p) => p.album).filter(Boolean))];
      albumsEl.innerHTML = '';
      if (names.length < 2) return;

      const items = [null, ...names];
      items.forEach((name) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'album-btn' + (activeAlbum === name ? ' active' : '');
        btn.textContent = name || 'All';
        btn.addEventListener('click', () => {
          activeAlbum = name;
          renderAlbums();
          renderGallery();
        });
        albumsEl.appendChild(btn);
      });
    }

    function renderGallery() {
      visiblePhotos = activeAlbum
        ? allPhotos.filter((p) => p.album === activeAlbum)
        : allPhotos;

      galleryEl.innerHTML = '';
      tileEls = [];
      if (!visiblePhotos.length) {
        emptyEl.textContent = 'No photographs published yet.';
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;

      visiblePhotos.forEach((photo, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell';

        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.setAttribute('aria-label', photo.caption || 'View photograph');

        const img = document.createElement('img');
        img.src = photo.thumbUrl;
        img.alt = photo.caption || '';
        img.loading = idx < 6 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.addEventListener('load', () => img.classList.add('loaded'));
        if (img.complete) img.classList.add('loaded');

        tile.appendChild(img);
        tile.addEventListener('click', () => openLightbox(idx));
        cell.appendChild(tile);
        galleryEl.appendChild(cell);
        tileEls.push(tile);
      });

      layoutGallery();
    }

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        if (Math.floor(galleryEl.clientWidth) !== lastLayoutWidth) {
          layoutGallery();
        }
      }).observe(galleryEl);
    } else {
      window.addEventListener('resize', layoutGallery);
    }

    function openLightbox(idx) {
      currentIndex = idx;
      showCurrent();
      lightboxEl.classList.add('open');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxEl.classList.remove('open');
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      currentIndex = -1;
    }

    function showCurrent() {
      const photo = visiblePhotos[currentIndex];
      if (!photo) return;
      lbImg.src = photo.fullUrl;
      lbImg.alt = photo.caption || '';
      lbCaption.textContent = photo.caption || '';
      lbExif.textContent = formatExif(photo.exif);

      // Preload adjacent full-resolution images.
      [-1, 1].forEach((delta) => {
        const next = visiblePhotos[(currentIndex + delta + visiblePhotos.length) % visiblePhotos.length];
        if (next && next !== photo) {
          const preload = new Image();
          preload.src = next.fullUrl;
        }
      });
    }

    function step(delta) {
      if (currentIndex < 0 || visiblePhotos.length < 2) return;
      currentIndex = (currentIndex + delta + visiblePhotos.length) % visiblePhotos.length;
      showCurrent();
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => step(-1));
    document.getElementById('lb-next').addEventListener('click', () => step(1));
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl || e.target.id === 'lb-stage') closeLightbox();
    });

    window.addEventListener('keydown', (e) => {
      if (currentIndex < 0) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
    });

    lightboxEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      } else {
        touchStartX = null;
        touchStartY = null;
      }
    }, { passive: true });
    lightboxEl.addEventListener('touchend', (e) => {
      if (touchStartX === null || touchStartY === null || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    (async () => {
      try {
        const res = await fetch(GALLERY_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allPhotos = Array.isArray(data.photos) ? data.photos : [];
        renderAlbums();
        renderGallery();
      } catch (err) {
        emptyEl.textContent = 'Unable to load gallery right now.';
        emptyEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
